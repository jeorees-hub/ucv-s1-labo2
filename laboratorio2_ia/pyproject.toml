[project]
name = "labo2"
version = "3.13.15"
description = ""
authors = [
    {name = "Jesus Ore",email = "jeorees@ucvvirtual.edu.pe"}
]
requires-python = ">=3.13"
dependencies = [
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "numpy (>=2.5.3,<3.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.poetry]
packages = [{include = "image_processing", from = "src"}]